[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "COACH_API_BASE,WHATSAPP_ACCESS_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_GRAPH_VERSION,WHATSAPP_VERIFY_TOKEN,WHATSAPP_ALLOWED_FROM,WHATSAPP_MORNING_TO"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/coach/dashboard"
  to = "/api/coach?action=dashboard"
  status = 200

[[redirects]]
  from = "/api/coach/coach-today"
  to = "/api/coach?action=coach-today"
  status = 200

[[redirects]]
  from = "/api/coach/sync-status"
  to = "/api/coach?action=sync-status"
  status = 200

[[redirects]]
  from = "/api/coach/message"
  to = "/api/coach?action=message"
  status = 200

[[redirects]]
  from = "/api/coach/brief"
  to = "/api/coach?action=brief"
  status = 200

[[redirects]]
  from = "/api/coach/workout"
  to = "/api/coach?action=workout"
  status = 200

[[redirects]]
  from = "/api/coach/nutrition-closeout"
  to = "/api/coach?action=nutrition-closeout"
  status = 200

[[redirects]]
  from = "/api/coach/post-workout"
  to = "/api/coach?action=post-workout"
  status = 200

[[redirects]]
  from = "/api/coach/motra-template"
  to = "/api/coach?action=motra-template"
  status = 200

[[redirects]]
  from = "/api/coach/intake"
  to = "/api/coach?action=intake"
  status = 200

[[redirects]]
  from = "/api/coach/apple-health-daily"
  to = "/api/coach?action=apple-health-daily"
  status = 200

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach-api"
  status = 200

[[redirects]]
  from = "/api/coach/whatsapp-send"
  to = "/.netlify/functions/whatsapp-send"
  status = 200

[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/whatsapp-webhook"
  status = 200
