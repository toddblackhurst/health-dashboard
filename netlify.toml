[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach-api"
  status = 200

[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/whatsapp-webhook"
  status = 200
