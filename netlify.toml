[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "COACH_API_BASE,WHATSAPP_GRAPH_VERSION"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/coach-today.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/rack-import.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/api/coach/dashboard"
  to = "/api/coach?action=dashboard"
  status = 200

[[redirects]]
  from = "/api/coach/message"
  to = "/api/coach?action=message"
  status = 200

[[redirects]]
  from = "/api/coach/messages"
  to = "/api/coach?action=command"
  status = 200

[[redirects]]
  from = "/api/coach/command"
  to = "/api/coach?action=command"
  status = 200

[[redirects]]
